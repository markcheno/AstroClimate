[project]
name = "astroclimate"
version = "0.1.0"
description = "Historical observing-condition climatology for astronomy, preprocessed for a static web app"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "astronomy-engine>=2.1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Virtual project: uv manages the environment but does not build/install this tree.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
